name: CI/CD Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances de dev
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Exécuter les tests avec Pytest
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Calculer le nom du propriétaire du dépôt en minuscules
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Calculer la valeur de APP_VERSION
        id: app_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées pour les tags Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/tasks-api
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Construire et pusher l'image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.version }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer le nom du propriétaire du dépôt en minuscules
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Déployer l'image du commit (SHA)
        run: |
          IMAGE="ghcr.io/${{ steps.owner.outputs.owner }}/tasks-api:sha-${GITHUB_SHA:0:7}"
          docker run -d --name app-staging -p 8000:8000 "$IMAGE"

      - name: Test de fumée (Smoke tests)
        run: |
          echo "Attente du démarrage du service..."
          for i in {1..10}; do
            if curl -f http://localhost:8000/health && curl -f http://localhost:8000/version; then
              echo "Smoke tests réussis !"
              exit 0
            fi
            echo "Essai $i/10 échoué, nouvelle tentative dans 2s..."
            sleep 2
          done
          echo "Échec des smoke tests."
          docker logs app-staging
          exit 1

      - name: Nettoyer le conteneur
        if: always()
        run: docker rm -f app-staging

  deploy-production:
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer le nom du propriétaire du dépôt en minuscules
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Déployer l'image de la Release (SemVer)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${{ steps.owner.outputs.owner }}/tasks-api:${VERSION}"
          docker run -d --name app-prod -p 8000:8000 "$IMAGE"

      - name: Test de fumée (Smoke tests)
        run: |
          echo "Attente du démarrage du service..."
          for i in {1..10}; do
            if curl -f http://localhost:8000/health && curl -f http://localhost:8000/version; then
              echo "Smoke tests réussis !"
              exit 0
            fi
            echo "Essai $i/10 échoué, nouvelle tentative dans 2s..."
            sleep 2
          done
          echo "Échec des smoke tests."
          docker logs app-prod
          exit 1

      - name: Nettoyer le conteneur
        if: always()
        run: docker rm -f app-prod
# test
  update-config:
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Récupérer le dépôt applicatif
        uses: actions/checkout@v4

      - name: Récupérer le dépôt de configuration
        uses: actions/checkout@v4
        with:
          repository: maximepetit03/tasks-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Mettre à jour la version de l'image
        run: bash scripts/set-image-tag.sh config/k8s/deployment.yaml "${VERSION#v}"

      - name: Commiter et pousser dans tasks-config
        run: |
          cd config
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Déploiement de tasks-api ${VERSION#v}"
          git push
