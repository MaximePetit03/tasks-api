name: Démo Secret et Variable

on:
  workflow_dispatch:

jobs:
  demo-secret:
    runs-on: ubuntu-latest
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
      APP_ENV: ${{ vars.APP_ENV }}
    steps:
      - name: Vérifier et afficher le secret et la variable
        run: |
          # 1. Échoue si le secret est vide
          if [ -z "$DEMO_TOKEN" ]; then
            echo "Erreur : Le secret DEMO_TOKEN est vide ou introuvable !"
            exit 1
          fi

          echo "Longueur du secret : ${#DEMO_TOKEN}"

          echo "Tentative d'affichage de DEMO_TOKEN : $DEMO_TOKEN"

          echo "Valeur de APP_ENV : $APP_ENV"
